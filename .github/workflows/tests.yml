name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and unit tests (Python 3.13)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run lint
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m pytest -q
