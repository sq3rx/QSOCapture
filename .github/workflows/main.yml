name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Uruchomi się tylko przy tagach zaczynających się od 'v'

jobs:
  build:
    runs-on: windows-latest  # Budujemy na Windowsie, aby uzyskać plik .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm build.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        run: iscc installer.iss /dMyAppVersion="${{ github.ref_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qsocapture.exe
            installer/QSOCapture-setup-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
