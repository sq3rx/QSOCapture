name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (Python 3.13)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compute version (tag name, or UTC date/time for manual runs)
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            fileversion=$(echo "$version" | sed 's/[^0-9.]//g')
          else
            version=$(date -u +'%Y%m%d.%H%M%S')
            fileversion=$(python -c "from version import APP_VERSION; print(APP_VERSION)" | sed 's/[^0-9.]//g')
          fi
          [ -n "$fileversion" ] || fileversion="1.0.0"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "fileversion=$fileversion" >> "$GITHUB_OUTPUT"

      - name: Build installer source (onedir)
        run: |
          $env:APP_VERSION="${{ steps.version.outputs.version }}"
          python build_nuitka.py

      - name: Build Windows installer
        run: iscc installer.iss /dMyAppVersion="${{ steps.version.outputs.version }}" /dMyVersionInfoVersion="${{ steps.version.outputs.fileversion }}"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $file = "installer/QSOCapture-setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $file)" | Out-File -Encoding ascii "installer/SHA256SUMS.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuitka-build-${{ steps.version.outputs.version }}
          path: |
            installer/QSOCapture-setup-${{ steps.version.outputs.version }}.exe
            installer/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute version from tag
        id: version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuitka-build-${{ steps.version.outputs.version }}
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Extract changelog for release body
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 == ("## Version " ver) { capture = 1; next }
            /^## Version / && capture { exit }
            capture { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi
          echo "--- release body (first 40 lines) ---"
          sed -n '1,40p' release_body.md

      - name: Append checksums
        shell: bash
        run: |
          echo "" >> release_body.md
          echo "### SHA-256" >> release_body.md
          echo '```' >> release_body.md
          cat artifacts/SHA256SUMS.txt >> release_body.md
          echo '```' >> release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
