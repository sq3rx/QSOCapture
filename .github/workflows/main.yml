name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Uruchomi się tylko przy tagach zaczynających się od 'v'
  workflow_dispatch:  # Pozwala uruchomić pipeline ręcznie z zakładki Actions (bez tagu, bez Release)

jobs:
  build:
    name: Build (Python 3.13)
    runs-on: windows-latest  # Budujemy na Windowsie, aby uzyskać plik .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'  # Nuitka najlepiej wspiera Python 3.13

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compute clean version (strip leading 'v')
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer source (onedir)
        run: |
          $env:APP_VERSION="${{ steps.version.outputs.version }}"
          python build_nuitka.py

      - name: Build Windows installer
        run: iscc installer.iss /dMyAppVersion="${{ steps.version.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuitka-build
          path: |
            installer/QSOCapture-setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    # Release powstaje TYLKO przy pushu tagu 'v*'. Przy ręcznym uruchomieniu
    # (workflow_dispatch) buildy się wykonają i zostaną jako artefakty, ale
    # żadna wersja nie zostanie opublikowana.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuitka-build
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
