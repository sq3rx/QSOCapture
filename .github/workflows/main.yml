name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'  # Uruchomi się tylko przy tagach zaczynających się od 'v'

jobs:
  build:
    runs-on: windows-latest  # Budujemy na Windowsie, aby uzyskać plik .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm spec.spec

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/twoja_nazwa.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
