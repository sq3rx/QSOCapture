[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv", "qt_launcher.build", "qt_launcher.dist", "__pycache__", "installer", "recordings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The launcher must configure logging and the Qt WebEngine environment before
# importing Qt, so several module-level imports intentionally follow code.
"qt_launcher.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
